# Keeps the free-tier API awake during Sydney daytime.
#
# Render's free plan sleeps a service after ~15 minutes idle and takes 30-60
# seconds to wake — long enough for a visitor from a LinkedIn link to give up.
# A health-check every 10 minutes prevents the sleep; /api/health does no
# work (no model call, no search).
#
# Daytime only, on purpose: Render's free plan gives 750 instance-hours a
# month across ALL services on the account, and Mini Bank shares it. Awake
# 7am-11pm Sydney (16h/day ≈ 490h/month) leaves room for Mini Bank's traffic
# without either service being suspended. GitHub cron is UTC; Sydney is
# UTC+11 in summer (AEDT), so 7am-11pm AEDT is 20:00-12:00 UTC.
#
# GitHub Actions minutes are free and unmetered for public repositories. The
# schedule is best-effort (runs can be a few minutes late) and GitHub disables
# scheduled workflows after 60 days without a commit, so a push every couple
# of months keeps it going.

name: Keep API awake

on:
  schedule:
    - cron: "*/10 20-23,0-12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "${{ vars.API_URL }}/api/health")
          echo "health returned $code"
          test "$code" = "200"
